<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A3323" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tarjeta" />

  <title>FESTEC 2026 · Tarjeta de Fidelidad</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="img/logo.png" />
  <link rel="apple-touch-icon" href="img/logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="page">
    <section class="loyalty-card" aria-label="Tarjeta de fidelidad">
      <header class="card-header">
        <img class="logo" src="img/logo.png" alt="FESTEC SJO 2026" />
      </header>

      <section class="stamps-section">
        <div id="stamps" class="stamps" aria-label="Sellos de fidelidad"></div>
      </section>

      <section class="customer-section">
        <span class="customer-label">CLIENTE</span>
        <h1 id="customerName" class="customer-name">Kiara González Roberts</h1>
      </section>

      <section class="code-section">
        <div class="barcode-card">
          <div class="barcode" aria-hidden="true"></div>
          <div id="customerCode" class="customer-code">CLIENTE-001</div>
          <p>Muestra el código al encargado</p>
        </div>
      </section>
    </section>

    <section class="controls" aria-label="Controles de demostración">
      <button id="editCustomerBtn" class="button button-primary" type="button">
        Cambiar cliente
      </button>
      <button id="resetBtn" class="button button-secondary" type="button">
        Reiniciar sellos
      </button>
    </section>

    <p class="hint">
      Toca los círculos para marcar o desmarcar sellos. El progreso se guarda en este dispositivo.
    </p>
  </main>

  <dialog id="customerDialog" class="dialog">
    <form id="customerForm" method="dialog" class="dialog-content">
      <h2>Datos del cliente</h2>

      <label for="nameInput">Nombre</label>
      <input id="nameInput" name="name" type="text" maxlength="60" required />

      <label for="codeInput">Código</label>
      <input id="codeInput" name="code" type="text" maxlength="30" required />

      <div class="dialog-actions">
        <button id="cancelDialogBtn" class="button button-secondary" type="button">
          Cancelar
        </button>
        <button class="button button-primary" type="submit">
          Guardar
        </button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
